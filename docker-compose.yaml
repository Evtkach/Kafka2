services:
  # 1. Zookeeper — необходим для координации Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper_service
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # 2. Брокер Kafka
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka_service
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Настройки адресов: Kafka будет доступна и внутри docker-сети, и с вашего ПК (localhost:9092)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  # 3. Сервис автоматического создания топика
  init-kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: init_kafka_service
    depends_on:
      - kafka
    # Скрипт ждет запуска Kafka и создает топик с 3 партициями
    entrypoint: [ "sh", "-c", "
      echo 'Waiting for Kafka to be ready...';
      kafka-topics --bootstrap-server kafka:29092 --list;
      echo 'Creating kafka topics...';
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic my_topic --partitions 3 --replication-factor 1;
      echo 'Successfully created topics:';
      kafka-topics --bootstrap-server kafka:29092 --describe --topic my_topic;
    " ]